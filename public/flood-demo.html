<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flood Early Warning System Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      color: #f5f5f5;
      border-bottom: 2px solid #22c55e;
      padding-bottom: 0.5rem;
    }
    .video-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }
    .video-card {
      flex: 1 1 480px;
      max-width: 560px;
      border: 1px solid #27272a;
      border-radius: 0;
      overflow: hidden;
      background: #18181b;
    }
    .video-card video {
      width: 100%;
      display: block;
    }
    .video-card .label {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a1a1aa;
      border-top: 1px solid #27272a;
    }
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: #22c55e;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Flood Early Warning System &mdash; Demo</h1>
  <div class="video-grid">
    <div class="video-card">
      <video controls preload="metadata">
        <source src="/videos/flood_demo.mp4" type="video/mp4">
      </video>
      <div class="label">Demo Overview</div>
    </div>
    <div class="video-card">
      <video controls preload="metadata">
        <source src="/videos/flood_demo_full.mp4" type="video/mp4">
      </video>
      <div class="label">Full Walkthrough</div>
    </div>
  </div>
  <a class="back-link" href="/">&larr; Back to Portfolio</a>
</body>
</html>
